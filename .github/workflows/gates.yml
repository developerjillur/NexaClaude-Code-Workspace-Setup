# The gates, at merge time.
#
# Every check in this workspace was local until this file existed, and a local gate is one a
# tired person walks around at 1am. This is the same set, run where it cannot be skipped.
#
# ── Adopting this in your own project ────────────────────────────────────────
#
# The `workspace` and `controls` jobs need nothing — they run on a bare clone of this repo.
#
# The `code` job runs against YOUR product code, and finds it three ways, in order:
#
#   1. your code is inside this repo (`code/`, or whatever `workspace.config.json` names)
#      → nothing to configure, it is already in the checkout
#   2. your code is a separate repository
#      → set the repository variable CODE_REPO (owner/name) and, if it is private, the
#        secret CODE_REPO_TOKEN with read access
#   3. neither
#      → the job reports that there is no product code and passes. That is a supported way to
#        use this repo, and it is said out loud rather than skipped in silence.
#
# **This file used to name one private repository in three places**, with hardcoded
# `code/src`, `code/tools`, `code/server.js` — which made the workspace un-adoptable by
# anyone else, and leaked a product into a package that is supposed to know nothing about it.
#
# It also carried the exact failure this workspace exists to prevent: **grep over a missing
# directory exits 2, which reads as "no matches found"**, so the hygiene job went green having
# scanned nothing. `scripts/ci-code-paths.mjs` now separates "no code here" from "code was
# configured and is missing", and refuses the second.
name: gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  workspace:
    name: Workspace gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # WIP=1, no card in two stages, no card past a gate it did not satisfy, every skill has
      # frontmatter, every control that refuses tested in BOTH directions.
      - run: node scripts/check.mjs --strict

      # The hooks ARE the enforcement, and for a while not one of them had a test — each was
      # verified by piping JSON in by hand, once, and never again.
      - run: node tests/hooks.test.mjs
      - run: node tests/guard-paths-with-spaces.mjs

      # Nothing from the project this was extracted from. Not a security check — an
      # ADOPTABILITY one, and invisible to whoever wrote the leak, because to them every one
      # of those names reads as normal.
      - run: node scripts/no-product-leakage.mjs

  controls:
    name: Are the controls actually watched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # Break one real rule at a time and see whether anything notices. A protection that can
      # be deleted with every test still green is not a protection — four were found that way
      # on the first run, including the rule written for a reported incident.
      #
      # Slow: it runs the whole suite once per mutation. That is why it is a merge gate rather
      # than a per-commit one.
      - run: node scripts/kill-audit.mjs

  code:
    name: Product code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Optional second checkout, only when the code lives in its own repository.
      - name: Fetch product repo
        if: vars.CODE_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_REPO_TOKEN || github.token }}
          path: code

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - id: paths
        name: Where is the code, and is it here
        env:
          CODE_REPO: ${{ vars.CODE_REPO }}
        run: node scripts/ci-code-paths.mjs --github

      - name: Install
        if: steps.paths.outputs.present == 'true'
        env:
          CODE_PATHS: ${{ steps.paths.outputs.paths }}
        run: |
          for d in $CODE_PATHS; do
            if [ -f "$d/package.json" ]; then
              ( cd "$d" && (npm ci --ignore-scripts || npm install --ignore-scripts) )
            fi
          done

      # Whatever the project calls its offline suite, in order of preference. Never a live
      # one: a CI run that spends tokens or places calls is a bill nobody approved.
      - name: Tests
        if: steps.paths.outputs.present == 'true'
        env:
          CODE_PATHS: ${{ steps.paths.outputs.paths }}
        run: |
          ran=0
          for d in $CODE_PATHS; do
            [ -f "$d/package.json" ] || continue
            for s in test:offline test:ci test; do
              if node -e "process.exit(require('./$d/package.json').scripts?.['$s'] ? 0 : 1)"; then
                echo "▸ $d — npm run $s"; ( cd "$d" && npm run "$s" ); ran=1; break
              fi
            done
          done
          [ "$ran" = 1 ] || echo "::notice::no offline test script found in the product code"

      # ── correctness, which nothing here was checking ──────────────────────────
      #
      # Every gate in this file aims at the AGENT's honesty — stubs, fabricated citations,
      # skipped stages. None of them aimed at whether the code compiles. `check.mjs` verified
      # that the STRINGS `lint`, `format` and `typecheck` existed as package.json keys, as a
      # warning, and nothing ever ran them.
      #
      # So a hallucinated library export, a missing import, an unformatted diff and a type
      # error all scored 5/5 on the review rubric and reached 6-done. Hallucinated APIs are the
      # single most-cited failure of AI-assisted coding and this workspace had no mechanism for
      # them at all — the one that exists is a type checker, and it was one line away.
      #
      # `continue-on-error` on format only: a formatting difference is not a reason to fail a
      # merge, but it must be visible. lint and typecheck are refusals.
      - name: Typecheck
        if: steps.paths.outputs.present == 'true'
        env:
          CODE_PATHS: ${{ steps.paths.outputs.paths }}
        run: |
          for d in $CODE_PATHS; do
            [ -f "$d/package.json" ] || continue
            if node -e "process.exit(require('./$d/package.json').scripts?.typecheck ? 0 : 1)"; then
              echo "▸ $d — npm run typecheck"; ( cd "$d" && npm run typecheck )
            else
              echo "::error::$d has no typecheck script. A hallucinated import is the commonest"
              echo "::error::AI-coding defect and a type checker is the mechanism for it."
              echo "::error::Copy plugin/templates/engineering-baseline/ — or set NEXA_ALLOW_NO_TYPECHECK=1"
              [ "${NEXA_ALLOW_NO_TYPECHECK:-}" = "1" ] || exit 1
            fi
          done

      - name: Lint
        if: steps.paths.outputs.present == 'true'
        env:
          CODE_PATHS: ${{ steps.paths.outputs.paths }}
        run: |
          for d in $CODE_PATHS; do
            [ -f "$d/package.json" ] || continue
            if node -e "process.exit(require('./$d/package.json').scripts?.lint ? 0 : 1)"; then
              echo "▸ $d — npm run lint"; ( cd "$d" && npm run lint )
            else
              echo "::error::$d has no lint script — copy plugin/templates/engineering-baseline/"
              echo "::error::or set NEXA_ALLOW_NO_LINT=1 if this project genuinely does not lint."
              [ "${NEXA_ALLOW_NO_LINT:-}" = "1" ] || exit 1
            fi
          done

      - name: Format check
        if: steps.paths.outputs.present == 'true'
        continue-on-error: true
        env:
          CODE_PATHS: ${{ steps.paths.outputs.paths }}
        run: |
          for d in $CODE_PATHS; do
            [ -f "$d/package.json" ] || continue
            node -e "process.exit(require('./$d/package.json').scripts?.format ? 0 : 1)" \
              && ( cd "$d" && npm run format -- --check 2>/dev/null || npm run format:check 2>/dev/null || true )
          done

      # ── the only gate that runs the APPLICATION ──────────────────────────────
      #
      # Everything else in this workflow reads artifacts. Two audits and a four-vendor council
      # independently named the absence of this as the single largest gap between the workspace
      # and a production-ready output: an agent walked a card with a cross-tenant SQL leak and
      # an unsigned Stripe webhook from 1-spec to 6-done with every gate green.
      #
      # `nexa-prove` exits 2 when nothing is declared, which fails this job on purpose — "no
      # invariants declared" is not "no invariants violated". A project that genuinely has none
      # yet should say so by declaring the ones it has; there is no honest empty state here.
      - name: Prove the invariants — the gate that runs the app
        if: steps.paths.outputs.present == 'true'
        run: node scripts/prove-invariants.mjs

      # Work that LOOKS finished. "No TODO" passes a stub — a stub has no TODO in it; it has a
      # signature and a body that returns a constant.
      - name: depth-check — does it do what it says
        if: steps.paths.outputs.present == 'true'
        env:
          SCAN_PATHS: ${{ steps.paths.outputs.scan }}
        run: node scripts/depth-check.mjs $SCAN_PATHS

      - name: TODO / FIXME / commented-out code
        if: steps.paths.outputs.present == 'true'
        env:
          SCAN_PATHS: ${{ steps.paths.outputs.scan }}
        run: |
          P="$SCAN_PATHS"
          if grep -rnE '\b(TODO|FIXME)\b' $P 2>/dev/null; then
            echo "::error::TODO or FIXME in shipped code — definition-of-done forbids it"; exit 1
          fi
          # Requires the SYNTAX of code, not just a keyword — a prose comment starting with
          # "await" or "function" is not commented-out code, and a check with false positives
          # is one people learn to ignore.
          if grep -rnE '^[[:space:]]*//[[:space:]]*(const |let |var )[A-Za-z_$][A-Za-z0-9_$]*[[:space:]]*=|^[[:space:]]*//[[:space:]]*(if|while|for|switch)[[:space:]]*\(|^[[:space:]]*//[[:space:]]*return[[:space:]].*;[[:space:]]*$|^[[:space:]]*//[[:space:]]*import[[:space:]].*[[:space:]]from[[:space:]]|^[[:space:]]*//[[:space:]]*[A-Za-z_$][A-Za-z0-9_$.]*\(.*\);[[:space:]]*$' $P 2>/dev/null; then
            echo "::error::commented-out code — delete it, git remembers"; exit 1
          fi
          echo "clean"

  secrets:
    name: No credentials, in the tree or the history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the history pass has nothing to read without this
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/scan-secrets.mjs
